<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title data-t="jfphone.title">Link Jellyfin</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
/* Opened from the QR code in Glasshouse Home's settings, on a phone on the
   same network. AUROR's colours, light or dark as the phone is. */
@font-face{font-family:"Space Grotesk";src:url("/assets/fonts/SpaceGrotesk.ttf") format("truetype");font-weight:300 700}
@font-face{font-family:"Space Mono";src:url("/assets/fonts/SpaceMono-Regular.ttf") format("truetype");font-weight:400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f3f5f7;color:#111827}
body{font:16px/1.5 "Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(28px,env(safe-area-inset-top)) 20px 40px;max-width:480px;margin:0 auto}
.kick{display:flex;align-items:center;gap:10px;font:14px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:#374151}
.kick:before{content:"";width:8px;height:8px;border-radius:2px;background:#f5a000}
h1{font-weight:300;font-size:34px;line-height:1.1;letter-spacing:-.5px;margin:12px 0 10px}
.sub{color:#5d6472;font-size:15px;margin-bottom:22px}
label{display:block;font-size:13px;color:#5d6472;margin:18px 0 6px}
input,select{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px}
input:focus,select:focus{outline:2px solid #d98c00;outline-offset:2px}
.note{font-size:13px;color:#5d6472;margin-top:6px}
button{width:100%;margin-top:28px;font:inherit;font-weight:600;color:#111827;background:#f5a000;border:0;border-radius:10px;padding:14px}
button:disabled{opacity:.5}
#msg{margin-top:16px;font-size:15px;min-height:1.5em}
#msg.err{color:#b42318}
#userRow[hidden]{display:none}
.done h1{margin-top:18vh}
@media (prefers-color-scheme:dark){
  html,body{background:#15191f;color:#e0e4ea}
  .kick{color:#f5a000}
  .sub,label,.note{color:#99a2af}
  input,select{background:#1c2028;border-color:rgba(255,255,255,.12)}
  input:focus,select:focus{outline-color:#f5a000}
  #msg.err{color:#ff8a80}
}
</style>
</head>
<body>
<main id="form">
  <div class="kick" translate="no">Glasshouse Home</div>
  <h1 data-t="jfphone.title">Link Jellyfin</h1>
  <p class="sub" data-t="jfphone.sub">The Top Shelf shows what is being watched, or what was added last. The key stays on the TV only.</p>

  <label for="server" data-t="jfphone.server">Server address</label>
  <input id="server" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.20:8096" translate="no">

  <label for="key" data-t="jfphone.key">API key</label>
  <input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" translate="no">
  <p class="note" data-t="jfphone.keyNote">In Jellyfin: Dashboard, API Keys, then +.</p>

  <div id="userRow" hidden>
    <label for="user" data-t="jfphone.user">User</label>
    <select id="user"></select>
    <p class="note" data-t="jfphone.userNote">Whose Continue Watching the TV shows.</p>
  </div>

  <button id="save" type="button" data-t="jfphone.link">Link</button>
  <p id="msg" role="status"></p>
</main>

<main id="done" class="done" hidden>
  <div class="kick" translate="no">Glasshouse Home</div>
  <h1 data-t="jfphone.done">Jellyfin is linked</h1>
  <p class="sub" id="doneSub"></p>
</main>

<script src="/assets/i18n.js"></script>
<script>
(function () {
  var code = (location.search.match(/[?&]c=([0-9a-f]+)/) || [])[1] || '';
  function $(id) { return document.getElementById(id); }
  var msg = $('msg'), btn = $('save');

  function say(text, err) { msg.textContent = text; msg.className = err ? 'err' : ''; }

  function post(body, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/jellyfin/link', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () {
      var r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) {}
      cb(r);
    };
    xhr.onerror = function () { cb(null); };
    body.c = code;
    xhr.send(JSON.stringify(body));
  }

  function expired(r) {
    if (!r || !r.expired) return false;
    btn.disabled = true;
    say(r.error, true);
    return true;
  }

  post({ check: true }, expired);

  btn.addEventListener('click', function () {
    var server = $('server').value.trim(), key = $('key').value.trim();
    if (!server) { $('server').focus(); return say(t('jfphone.needServer', 'Enter the server address.'), true); }
    if (!key) { $('key').focus(); return say(t('jfphone.needKey', 'Enter the API key.'), true); }
    btn.disabled = true;
    say(t('jfphone.trying', 'Trying the server…'));
    post({ server: server, key: key, user: $('userRow').hidden ? '' : $('user').value }, function (r) {
      btn.disabled = false;
      if (!r) return say(t('jfphone.unreachable', 'Could not reach the TV. Check the phone is on the same network.'), true);
      if (expired(r)) return;
      if (r.ok) {
        $('form').hidden = true;
        $('done').hidden = false;
        $('doneSub').textContent = t('jfphone.doneSub', 'As {user}. The TV shows it in the Top Shelf; this page can be closed.', { user: r.user });
        return;
      }
      if (r.needUser) {
        var sel = $('user');
        sel.innerHTML = '';
        (r.users || []).forEach(function (u) {
          var o = document.createElement('option');
          o.value = u.id;
          o.textContent = u.name;
          sel.appendChild(o);
        });
        $('userRow').hidden = false;
        return say(t('jfphone.pickUser', 'The server has more than one user: pick one.'));
      }
      say(r.error || t('jfphone.failed', 'That did not work. Try again.'), true);
    });
  });
})();
</script>
</body>
</html>
