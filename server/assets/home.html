<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glasshouse Home</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style id="look">
/* Glasshouse Home: the TV's home screen, driven by the remote. A 1920x1080
   stage scaled to the window. Warm white on true black, never full white on
   the panel; amber only for what was last on and for arranging. The rows sit
   low over black, or over a darkened uploaded wallpaper for the time of day. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#ece7df;-webkit-font-smoothing:antialiased;cursor:default}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000;overflow:hidden;
  -webkit-transform-origin:0 0;transform-origin:0 0}

/* Two layers cross-fade when the slot changes. The drift keeps the picture
   from sitting still on the panel; the scrim keeps the text side and the rows
   dark. */
#wall{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
#wall .layer{position:absolute;left:-3%;top:-3%;right:-3%;bottom:-3%;background-position:center;background-size:cover;
  background-repeat:no-repeat;opacity:0;-webkit-transition:opacity 2.4s ease;transition:opacity 2.4s ease;
  -webkit-animation:drift 180s ease-in-out infinite alternate;animation:drift 180s ease-in-out infinite alternate}
@-webkit-keyframes drift{from{-webkit-transform:scale(1) translate(0,0)}to{-webkit-transform:scale(1.04) translate(-1.2%,-.8%)}}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.04) translate(-1.2%,-.8%)}}
#scrim{position:absolute;left:0;top:0;right:0;bottom:0;
  background:radial-gradient(ellipse 34% 30% at 92% 14%,rgba(0,0,0,.55),rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 38%,rgba(0,0,0,0) 70%),
    linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,.45) 36%,rgba(0,0,0,.82) 62%,rgba(0,0,0,.92) 100%)}

#rows{position:relative}
.row h2,.tile{text-shadow:0 1px 12px rgba(0,0,0,.55)}

/* The plate: the picture of what was last on, right-aligned in three rows
   that mirror the source's: the signal level with its kind, the mode, read
   from the sofa, on its title's line, and the OLED light level with its input.
   The rows keep their height when empty, so a plate with only one of them
   still lines up with the source beside it. The mode's margins put its
   smaller type on the title's baseline. */
#plate{-webkit-flex:0 0 auto;flex:0 0 auto;max-width:640px;margin-left:56px;text-align:right;padding-bottom:2px;white-space:nowrap}
#plate.none{display:none}
#plSig{font-size:23px;height:32px;line-height:32px;color:#a39d93}
#plSig span+span{margin-left:22px}
#plMode{font-family:'Outfit',sans-serif;font-size:52px;height:70px;line-height:70px;font-weight:400;letter-spacing:-.5px;margin:15px 0 5px;
  overflow:hidden;text-overflow:ellipsis}
#plStrip{font-size:23px;height:36px;line-height:38px;color:#a39d93}
#plStrip b{font-weight:400;color:#6b665e;margin-right:12px}

/* The rows sit centred between the clock and the arrange bar, so three rows
   land a little below where they used to and fewer settle lower. The spacers shrink first, so rows taller than the space run on down
   rather than under the clock. A row with nothing to show is left out, and
   while arranging stands as a slot that can still be moved. */
#rows{position:absolute;left:0;right:0;top:296px;bottom:40px;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#rows:before,#rows:after{content:"";-webkit-flex:1 1 0;flex:1 1 0}
.row{-webkit-flex:0 0 auto;flex:0 0 auto}
.row.empty{display:none}
.arranging .row.empty{display:block}
.slot{margin:0 112px;height:64px;line-height:60px;padding:0 22px;font-size:21px;color:#6b665e;
  border:2px dashed #2a2825;border-radius:6px}
.arranging .row.active .slot{color:#ece7df;border-color:#e9ad55;border-style:solid}
.arranging .row.held-row .slot{border-style:dashed;background:#231d12}
.row{margin-bottom:22px}
.row h2{padding:0 112px;font-size:25px;font-weight:400;color:#a39d93;margin-bottom:10px}
.row h2 span{color:#6b665e;margin-left:14px}
.wrap{overflow:hidden;margin:0 90px;padding:6px 22px}
.track{display:-webkit-flex;display:flex;white-space:nowrap;
  -webkit-transition:-webkit-transform .28s cubic-bezier(.2,.7,.2,1);transition:transform .28s cubic-bezier(.2,.7,.2,1)}

.tile{position:relative;-webkit-flex:0 0 auto;flex:0 0 auto;margin-right:8px;padding:16px 20px 18px;border-radius:6px;
  outline:2px solid transparent;opacity:.8;
  -webkit-transition:background-color .12s,outline-color .12s,-webkit-transform .12s;transition:background-color .12s,outline-color .12s,transform .12s}
.row:not(.active) .tile{opacity:.58}
.tile.focus{background:rgba(20,19,16,.86);outline-color:#ece7df;opacity:1}

.app{width:168px;padding:14px;text-align:center}
.app img,.app .mono{display:block;width:112px;height:112px;margin:0 auto;border-radius:14px}
.app .mono{background:#2a2825;color:#ece7df;font-family:'Outfit',sans-serif;font-size:44px;font-weight:300;line-height:112px}
.app .nm{font-size:21px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dev{width:380px;height:124px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  -webkit-justify-content:space-between;justify-content:space-between}
.dev .nm{font-family:'Outfit',sans-serif;font-size:32px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .path{font-size:20px;color:#a39d93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .st{font-size:19px;color:#6b665e;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.dev .st em{font-style:normal}
.dev.last .st em{color:#e9ad55}
.row .dev.unused{opacity:.3}
.row .dev.unused.focus{opacity:.6}
.dev.last .st em:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e9ad55;margin-right:10px;vertical-align:2px}

.ch{width:224px;height:176px}
.ch .num{font-family:'Outfit',sans-serif;font-size:48px;line-height:.9;font-weight:300}
.ch .nm{font-size:21px;color:#a39d93;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .prog{font-size:21px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .bar{height:2px;background:#2a2825;margin-top:10px}
.ch .bar i{display:block;height:100%;background:#a39d93}
.ch.focus .bar i{background:#ece7df}
.ch .next{font-size:17px;color:#6b665e;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Arranging */
.arranging .row h2{color:#ece7df}
.row h2 .sort{display:none;margin-left:22px;font-style:normal;font-size:20px;color:#a39d93;padding:4px 14px;border-radius:5px;background:#141310;
  outline:2px solid transparent;vertical-align:2px}
.arranging .row h2 .sort{display:inline-block}
.arranging .row .sort.focus{color:#ece7df;outline-color:#e9ad55}
.arranging .tile.focus{outline-color:#e9ad55}
.arranging .tile.held{-webkit-transform:translateY(-8px);transform:translateY(-8px);background:#231d12;outline:2px dashed #e9ad55}
.row .tile.hidden{opacity:.22}
.row .tile.hidden.focus{opacity:.5}
.tile .hid{display:none;position:absolute;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  font-size:18px;color:#ece7df;background:#000;padding:3px 10px;border-radius:4px}
.tile.hidden .hid{display:block}
.arranging .row.held-row h2{color:#e9ad55}
#banner{position:absolute;left:112px;right:112px;bottom:26px;display:none;-webkit-align-items:center;align-items:center;
  font-size:20px;color:#a39d93;padding:14px 22px;border-radius:6px;background:#141310;border-left:3px solid #e9ad55}
.arranging #banner{display:-webkit-flex;display:flex}
#banner b{color:#ece7df;font-weight:600;margin-right:8px}
#banner .keys{-webkit-flex:1 1 auto;flex:1 1 auto;margin-left:34px}
#banner .btn{margin-left:12px;padding:8px 18px;border-radius:5px;color:#ece7df;background:#231d12;outline:2px solid transparent}
#banner .btn.focus{outline-color:#e9ad55}

#toast{position:absolute;z-index:1;left:112px;bottom:26px;font-size:23px;color:#ece7df;padding:14px 22px;border-radius:6px;
  background:#141310;border-left:3px solid #e9ad55;opacity:0;-webkit-transform:translateY(8px);transform:translateY(8px);
  -webkit-transition:opacity .2s,-webkit-transform .2s;transition:opacity .2s,transform .2s;max-width:1100px}
#toast.show{opacity:1;-webkit-transform:none;transform:none}
#toast small{display:block;font-size:18px;color:#a39d93;margin-top:4px}
.arranging #toast{bottom:96px}

/* Recent apps: Back's panel, in place of the one in LG's Home. The
   snapshots are the panel: each a small copy of the screen as it was left,
   the focused one at full strength in a warm white frame, the rest dimmed.
   Close shows only under the focused card; down reaches it. */
#recents{position:absolute;left:0;right:0;bottom:0;height:560px;padding-top:92px;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,.94) 64px,#000 120px);
  -webkit-transform:translateY(100%);transform:translateY(100%);visibility:hidden;
  -webkit-transition:-webkit-transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s .32s;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s .32s}
.recents #recents{-webkit-transform:none;transform:none;visibility:visible;-webkit-transition-delay:0s;transition-delay:0s}
#rows{-webkit-transition:opacity .32s;transition:opacity .32s}
.recents #rows{opacity:.25}
.recents #rows .tile.focus{outline-color:transparent;background:none}
#recents .head{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;padding:0 112px;margin-bottom:18px}
#recents h2{-webkit-flex:1 1 auto;flex:1 1 auto;font-family:'Outfit',sans-serif;font-size:40px;font-weight:300;letter-spacing:-.3px;color:#ece7df}
#btnCloseAll{font-size:21px;color:#a39d93;padding:8px 18px;margin-right:-18px;border-radius:5px;outline:2px solid transparent}
#btnCloseAll.focus{color:#ece7df;background:rgba(20,19,16,.86);outline-color:#ece7df}
#btnCloseAll.none{display:none}
#recents .tile.rc{width:372px;margin-right:32px;padding:0;background:none;outline:0;opacity:.5}
#recents .tile.rc.focus{opacity:1}
.rc .shot{position:relative;width:372px;height:209px;border-radius:6px;overflow:hidden;background:#141310;
  outline:2px solid transparent;outline-offset:4px;-webkit-transition:outline-color .12s;transition:outline-color .12s}
.rc.focus .shot{outline-color:#ece7df}
.rc.on-x .shot{outline-color:#3a3732}
.rc .shot img{display:block;width:100%;height:100%;object-fit:cover}
.rc .shot .mono{position:absolute;left:0;top:0;right:0;bottom:0;text-align:center;line-height:209px;
  font-family:'Outfit',sans-serif;font-size:72px;font-weight:300;color:#6b665e}
.rc .nm{font-size:22px;font-weight:600;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .x{display:inline-block;visibility:hidden;font-size:19px;color:#a39d93;margin:10px 0 0 -12px;padding:5px 12px;border-radius:4px;outline:2px solid transparent}
.rc.focus .x{visibility:visible}
.rc.on-x .x{color:#ece7df;background:rgba(20,19,16,.86);outline-color:#ece7df}
#recents .empty{padding:8px 0 0;font-size:26px;color:#a39d93}
#recents .empty b{display:block;font-family:'Outfit',sans-serif;font-size:32px;font-weight:300;color:#ece7df;margin-bottom:8px}

#fault{position:absolute;left:112px;top:420px;width:1200px;display:none}
#fault.show{display:block}
#fault h1{font-family:'Outfit',sans-serif;font-weight:300;font-size:56px;margin-bottom:18px}
#fault p{font-size:26px;color:#a39d93}

@media (prefers-reduced-motion:reduce){
  .track,#toast,.tile{-webkit-transition:none;transition:none}
  #wall .layer{-webkit-animation:none;animation:none}
}
</style>

<body>
<div id="stage">
<div id="drift">
  <div id="wall"><div class="layer"></div><div class="layer"></div></div>
  <div id="scrim"></div>

  <section id="shelf">
    <div id="topbar">
      <div id="when">
        <div id="clock">&mdash;</div>
        <div id="date">&mdash;</div>
        <div id="themeNote"></div>
      </div>
      <span class="topbtn" id="btnTheme" role="button" aria-label="Light or dark theme" data-t-aria-label="home.theme.toggle">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </span>
      <span class="topbtn" id="btnSettings" role="button" aria-label="Settings" data-t-aria-label="home.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
    </div>
    <div id="shelfBody" class="none">
      <div class="sh-title">
        <div class="kick" id="shelfKind">&mdash;</div>
        <div id="shelfTitle">&mdash;</div>
        <div id="shelfSub">&mdash;</div>
      </div>
      <div class="sh-cards">
        <div class="kick" id="shelfCardsKind">&mdash;</div>
        <div id="shelfCards"></div>
      </div>
      <div class="sh-stats">
        <div class="kick" id="shelfStatsKind">&mdash;</div>
        <div id="shelfStats"></div>
      </div>
    </div>
    <div id="plate" class="none">
      <div id="plSig"></div>
      <div id="plMode"></div>
      <div id="plStrip"></div>
    </div>
  </section>

  <div id="rowsView"><main id="rows"></main></div>

  <div id="banner">
    <i class="mark"></i>
    <b id="bannerState">&mdash;</b>
    <span class="keys" data-t="home.arrange.keysShort">OK picks up or drops · Held, the arrows move it · Back hides</span>
    <span class="btn" id="btnHide" data-t="home.arrange.hide">Hide or show</span>
    <span class="btn" id="btnReset" data-t="home.arrange.reset">Reset</span>
    <span class="btn" id="btnDone" data-t="home.arrange.done">Done</span>
  </div>
  <div id="toast"></div>

  <section id="recents">
    <div class="head">
      <h2 data-t="home.recents.title">Recent apps</h2>
      <span class="btn" id="btnCloseAll" data-t="home.recents.closeAll">Close all</span>
    </div>
    <div class="wrap"><div class="track" id="recentsTrack"></div></div>
  </section>

  <section id="settings">
    <div id="setWhen"><div id="setClock">&mdash;</div><div id="setDate">&mdash;</div></div>
    <div id="setSide">
      <span id="setBack" data-t="home.set.back">&lsaquo; Home</span>
      <div class="kick" data-t="home.settings">Settings</div>
      <h1 id="setTitle"></h1>
      <p id="setDesc"></p>
      <nav id="setNav"></nav>
    </div>
    <div id="setRows"></div>
  </section>

  <div id="fault">
    <div class="kick" translate="no">Glasshouse Home</div>
    <h1 data-t="home.fault.title">Glasshouse is not answering</h1>
    <p data-t="home.fault.desc">Glasshouse Home comes back when it answers. Should it stay silent, LG's Home comes back in a few minutes.</p>
  </div>
</div>
  <div id="mascot" aria-hidden="true"></div>
</div>

<script>
/*
 * Glasshouse Home's view. Everything comes from /api/home/*: the layout shared
 * with the dashboard's Home tab, the TV's apps, CEC devices and picked
 * channels, and what was last on. Opening a tile goes back to the server,
 * which opens only what it listed. Strict ES5, as every page the TV's own
 * browser shows.
 */
(function () {
  var ROW_TITLES = {
    app: t('home.row.apps', 'Apps'),
    dev: t('home.row.inputs', 'Inputs'),
    ch: t('home.row.channels', 'Channels')
  };
  var LG_HOME_TILE = 'lg-home';
  // The remote's keys as webOS reports them to a page.
  var KEY = { left: 37, up: 38, right: 39, down: 40, ok: 13, back: 461, red: 403, yellow: 405 };
  // Held this long, OK arranges the tiles rather than opening one.
  var LONG_PRESS_MS = 800;
  var BEAT_MS = 5000;

  var data = null;       // the catalogue: apps, devices, channels, order
  var layout = null;     // rows, order, sort, hidden, channels, hintSeen, picture
  var guideData = {};
  var lastOn = { kind: null };
  // last: the tile focused last, which the bar's Hide or show acts on.
  // top: the button focused above the rows, by its index in TOP, or -1.
  var state = { row: 0, col: {}, arranging: false, held: false, bar: -1, top: -1, last: null };
  var BAR = ['btnHide', 'btnReset', 'btnDone'];
  var TOP = ['btnTheme', 'btnSettings'];
  var DASHBOARD_APP = 'com.tvweb.dashboard';
  // The focus rests this long on a tile before its Top Shelf data is asked for.
  var SHELF_REST_MS = 450;
  var JELLYFIN_TTL_MS = 60000, STATS_TTL_MS = 10000;
  /*
   * Banners: full 16:9 colour cards in assets/banners, the logo white on the
   * brand's colour, from Simple Icons (CC0-1.0). Matched on an app's title, or
   * on the id for Glasshouse's, LG's Home and the web browser. An app with
   * none gets its own icon on a colour: the brand's where it is known, else
   * one taken from its name, so the row stays colourful.
   */
  var BANNERS = [
    [/youtube ?music/i, 'youtube-music'], [/youtube/i, 'youtube'], [/jellyfin/i, 'jellyfin'], [/spotify/i, 'spotify'],
    [/netflix/i, 'netflix'], [/plex/i, 'plex'], [/kodi/i, 'kodi'], [/twitch/i, 'twitch'], [/apple ?tv/i, 'apple-tv'],
    [/crunchyroll/i, 'crunchyroll'], [/emby/i, 'emby'], [/tidal/i, 'tidal'], [/deezer/i, 'deezer'],
    [/apple ?music/i, 'apple-music'], [/steam/i, 'steam'], [/playstation/i, 'playstation'], [/dazn/i, 'dazn'],
    [/paramount/i, 'paramount-plus'], [/vimeo/i, 'vimeo'], [/soundcloud/i, 'soundcloud'], [/rakuten/i, 'rakuten-tv'],
    [/^sky\b/i, 'sky'], [/^com\.tvweb\.dashboard$/, 'glasshouse'], [/^lg-home$/, 'lg-home'], [/^com\.webos\.app\.browser$/, 'browser']
  ];
  // Brands Simple Icons leaves out, by their own colours.
  var BRAND_COLOURS = [
    [/prime ?video|amazon/i, '#1AB4F0', '#0067A8'], [/disney/i, '#1B4FD8', '#0B1F5C'], [/xbox/i, '#1DA31D', '#0B5C0B'],
    [/rai ?play/i, '#1A6FE0', '#0A2E73'], [/mediaset|infinity/i, '#2F62D9', '#172F72']
  ];
  var build = null;
  var okDownAt = 0, okTimer = null, okLong = false, okInRecents = false, backDown = false;
  var beatFails = 0;
  var layoutRevision = 0, layoutBusy = false;
  // home.json's version as last loaded: a heartbeat bringing another means it
  // was changed elsewhere, such as from a dashboard, and the layout is reloaded.
  var layoutVersion = null;
  var loadRetry = null, wallAvailable = false, initialEscape = false;
  var wallSlots = null, wallRevision = '';

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // The words from the browser's locale, the order from the translation.
  function dateText(d) {
    function part(opts) {
      try { return d.toLocaleDateString(undefined, opts); } catch (e) { return ''; }
    }
    return t('home.date', '{weekday} {day} {month}', {
      weekday: part({ weekday: 'long' }), day: d.getDate(), month: part({ month: 'long' })
    });
  }

  // ---------------------------------------------------------------- items

  // The server puts a Last opened row in that order; the view shows it as sent.

  // ---------------------------------------------------------------- rows

  function rowNote(kind, list) {

  function render() {

        '<h2>' + esc(ROW_TITLES[kind]) + (list.length ? '<span>' + note + '</span>' : '') +
        '<em class="sort">' + esc(sortLabel(kind)) + '</em></h2>' +

  function bannerFor(a) {

    return null;
  }

  // The colour behind an app with no banner, as an inline style the skin's !important rules give way to.
  function tint(a) {

    for (var i = 0; i < BRAND_COLOURS.length; i++) {

      var h = 0;
      for (var j = 0; j < title.length; j++) h = (h * 31 + title.charCodeAt(j)) % 360;

  }

  var hiddenLabel = '<span class="hid">' + esc(t('home.hidden', 'Hidden')) + '</span>';

  var TILE = {
    app: function (a, i) {
      var cls = 'tile app' + (hidden('app', a.id) ? ' hidden' : '');
      var banner = bannerFor(a);
      var icon = banner ? '<img class="banner" src="' + esc(banner) + '" alt="">'
        : a.icon ? '<img class="tinted" src="' + esc(a.icon) + '" alt=""' + tint(a) + '>'
        : '<span class="mono tinted"' + tint(a) + '>' + esc(a.lg ? 'LG' : String(a.title).charAt(0)) + '</span>';
      return '<div class="' + cls + '" data-c="' + i + '">' + icon + '<div class="nm">' + esc(a.title) + '</div>' + hiddenLabel + '</div>';
    },
    dev: function (d, i) {

      var path = d.via ? t('home.dev.through', 'HDMI {port}, through {via}', { port: d.port, via: d.via })
        : t('home.dev.port', 'HDMI {port}', { port: d.port });
      return '<div class="' + cls + '" data-c="' + i + '"><div class="nm">' + esc(d.name) + '</div>' +
        '<div class="path">' + esc(path + ' \u00b7 ' + (last ? t('home.dev.last', 'Last watched') : t('home.dev.connected', 'Connected'))) + '</div>' +
        hiddenLabel + '</div>';
    },
    ch: function (c, i) {
      var cls = 'tile ch' + (hidden('ch', c.id) ? ' hidden' : '');
      var shows = guideData[c.id] || [];
      var body = '<div class="num">' + esc(c.number) + '</div><div class="nm">' + esc(c.name) + '</div>';
      if (shows.length) {

  function applyFocus(instant) {
    var rows = document.querySelectorAll('.row');
    for (var ri = 0; ri < rows.length; ri++) {
      var rowEl = rows[ri], kind = rowEl.getAttribute('data-key'), active = ri === state.row && state.bar < 0 && state.top < 0;
      rowEl.className = 'row' + (rowEl.getAttribute('data-empty') ? ' empty' : '') + (active ? ' active' : '') + (active && state.held ? ' held-row' : '');
      var tiles = rowEl.querySelectorAll('.tile'), c = colOf(kind);

      }

  // Keeps the focused tile in view by moving the track, not the page.

  // ---------------------------------------------------------------- top shelf

  function renderNow() {

  }

  /*
   * The Top Shelf shows the focused tile. Jellyfin shows what is being
   * watched or was added last, Glasshouse the TV's own readings, an input its
   * device; any other tile its name. Their data is asked for only once the
   * focus has rested on the tile, and the shelf fades in again only when what
   * it shows has changed.
   */
  var shelfShown = null, shelfRest = null;
  var shelfData = { jellyfin: null, jellyfinAt: 0, stats: null, statsAt: 0 };

  function look() { return (layout && layout.look) || { theme: 'auto', mascots: true, saverBright: false, shelf: {} }; }
  function shelfOn(part) { return look().shelf[part] !== false; }
  function isJellyfin(it) { return /jellyfin/i.test(it.id + ' ' + it.title); }

  function shelfFor(kind, it) {
    var open = t('home.shelf.open', 'Press OK to open');
    if (kind === 'app') {
      if (it.lg) return { mode: 'title', kind: it.title, title: t('home.shelf.lgHome', 'Back to LG’s Home'), sub: open };
      if (isJellyfin(it) && shelfOn('jellyfin')) {
        var jf = shelfData.jellyfin;
        if (jf && (jf.state === 'resume' || jf.state === 'latest')) {
          return { mode: 'cards', items: jf.items.slice(0, 3),
            kind: jf.state === 'resume' ? t('home.jf.resume', 'Jellyfin · Continue watching') : t('home.jf.latest', 'Jellyfin · Recently added') };
        }
        if (jf && jf.state === 'offline') return { mode: 'title', kind: it.title, title: it.title, sub: t('home.jf.offline', 'Server not reachable · Press OK to open the app') };
        if (jf && jf.state === 'empty') return { mode: 'title', kind: it.title, title: it.title, sub: t('home.jf.empty', 'Nothing new on the server · Press OK to open') };
      }

      }

        mode: 'title',

        sub: (lastDev ? t('home.dev.last', 'Last watched') : t('home.dev.connected', 'Connected')) + ' · ' +

      mode: 'title',

  }

  function cardLine(c) {

  }

  function shelfHtml(s) {
    if (s.mode === 'cards') {
      return s.items.map(function (c) {
        return '<div class="card"><div class="pic">' + (c.image ? '<img src="' + esc(c.image) + '" alt="">' : '') +
          (c.progress !== null ? '<div class="bar"><i style="width:' + c.progress + '%"></i></div>' : '') + '</div>' +

  }

  function renderShelf() {
    if (!data || !layout || state.top >= 0 || state.bar >= 0) return;
    var kind = rowKey(), it = items(kind)[colOf(kind)];
    var s = it ? shelfFor(kind, it) : null;
    var key = s ? JSON.stringify(s) : '';

    shelfShown = key;

      $('shelfTitle').textContent = s.title;
      $('shelfSub').textContent = s.sub;

  // Called on every focus change: the data waits for the focus to rest.

    shelfRest = setTimeout(loadShelfData, SHELF_REST_MS);
  }

  function loadShelfData() {

    var kind = rowKey(), it = items(kind)[colOf(kind)];
    if (!it || kind !== 'app') return;
    var now = Date.now();
    if (isJellyfin(it) && shelfOn('jellyfin') && now - shelfData.jellyfinAt > JELLYFIN_TTL_MS) {
      shelfData.jellyfinAt = now;
      getJson('/api/home/jellyfin', function (r) {
        if (!r || !r.ok) { shelfData.jellyfinAt = 0; return; }
        shelfData.jellyfin = r;
        renderShelf();
      });
    }
    if (it.id === DASHBOARD_APP && shelfOn('glasshouse') && now - shelfData.statsAt > STATS_TTL_MS - 500) {
      shelfData.statsAt = now;
      getJson('/api/stats', function (r) {
        if (!r) { shelfData.statsAt = 0; return; }
        var mem = r.mem && r.mem.total ? Math.round((1 - r.mem.avail / r.mem.total) * 100) : null;

          cpu: typeof r.load === 'number' ? Math.round(r.load) : null,

      });

  // ---------------------------------------------------------------- theme

  /*
   * Light from 06:00 to 17:00, dark from 17:00, the wallpapers' evening slot.
   * A switch by hand lasts until the next of those changes: it is kept with
   * the period it was made in, and a night runs from 17:00 to 06:00 the next
   * day. ?hour= previews another hour here too.
   */
  var THEME_KEY = 'glasshouse.home.theme';
  var themeOverride = null;
  try { themeOverride = JSON.parse(window.localStorage.getItem(THEME_KEY) || 'null'); } catch (e) {}

  function themePeriod() {
    var d = new Date();
    var h = preview.hour !== undefined ? +preview.hour % 24 : d.getHours();
    var day = h >= 6 && h < 17;
    if (h < 6) d = new Date(d.getTime() - 24 * 3600 * 1000);
    return { auto: day ? 'light' : 'dark', until: day ? '17:00' : '06:00',
             period: (day ? 'day ' : 'night ') + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() };
  }

  // Settings can keep one theme instead; the button then switches that.
  function currentTheme() {
    var p = themePeriod();
    var kept = look().theme === 'light' || look().theme === 'dark' ? look().theme : null;
    var manual = !kept && themeOverride && themeOverride.period === p.period ? themeOverride.theme : null;
    p.name = kept || manual || p.auto;
    p.kept = !!kept;
    p.manual = !!manual;
    return p;
  }

  var themeName = 'dark';
  function applyTheme() {
    var cur = currentTheme();
    if (themeOverride && !cur.manual) saveThemeOverride(null);
    $('themeNote').textContent = !cur.manual ? ''
      : cur.name === 'light' ? t('home.theme.untilLight', 'Light theme until {time}', { time: cur.until })
      : t('home.theme.untilDark', 'Dark theme until {time}', { time: cur.until });
    if (cur.name === themeName) return;
    themeName = cur.name;
    stageClass();

  }

  function saveThemeOverride(o) {
    themeOverride = o;
    try {
      if (o) window.localStorage.setItem(THEME_KEY, JSON.stringify(o));
      else window.localStorage.removeItem(THEME_KEY);
    } catch (e) {}
  }

  function toggleTheme() {
    var cur = currentTheme(), next = cur.name === 'dark' ? 'light' : 'dark';
    if (cur.kept) return setLook({ theme: next });
    saveThemeOverride(next === cur.auto ? null : { theme: next, period: cur.period });
    applyTheme();
  }

  function pressTop(i) {
    if (i === 0) return toggleTheme();
    openSettings();
  }

  function topAt(target) {
    while (target && target !== document.body) {
      if (target.id && TOP.indexOf(target.id) !== -1) return TOP.indexOf(target.id);
      target = target.parentNode;
    }
    return -1;
  }

  // ---------------------------------------------------------------- settings

  /*
   * Home's settings on the TV, from the gear: sections down the left, their
   * rows on the right. Left and right move between the two, OK changes a row,
   * Back goes home. Jellyfin is linked from a phone, by the QR code here.
   */
  var settings = { open: false, cat: 0, side: true, row: {}, rows: [], busy: '', pairUrl: null, pairError: '', pairAt: 0, poll: null };
  var SET_CATS = [
    { id: 'look', label: t('home.set.look', 'Look'),
      desc: t('home.set.lookDesc', 'Home’s theme and the screen saver. Automatic: light from 06:00 to 17:00, dark from 17:00.') },
    { id: 'shelf', label: t('home.set.shelf', 'Top Shelf'),
      desc: t('home.set.shelfDesc', 'What the band at the top shows when an app or an input is selected.') },
    { id: 'tiles', label: t('home.set.tiles', 'Tiles'),
      desc: t('home.set.tilesDesc', 'Which apps Home shows. To reorder them, hold OK on a tile.') },
    { id: 'jellyfin', label: 'Jellyfin',
      desc: t('home.set.jfDesc', 'The server the Top Shelf takes Continue watching and Recently added from.') },
    { id: 'more', label: 'Glasshouse',
      desc: t('home.set.moreDesc', 'Everything else, from switching this Home on or off to wallpapers and Home Assistant, is in the Glasshouse app.') }
  ];

  function onText(on) { return on ? t('home.set.on', 'On') : t('home.set.off', 'Off'); }

  function setRows(id) {
    var lk = look(), saver = data && data.saver;
    if (id === 'look') {
      var themes = ['auto', 'light', 'dark'];
      var themeText = { auto: t('home.set.themeAuto', 'Automatic'), light: t('home.set.themeLight', 'Light'), dark: t('home.set.themeDark', 'Dark') };
      var saverOn = !!(saver && saver.mode === 'auror');
      var rows = [{
        kind: 'cycle', label: t('home.set.theme', 'Theme'), help: t('home.set.themeHelp', 'The button on Home changes it until the next switch'),
        value: themeText[lk.theme], act: function () { setLook({ theme: themes[(themes.indexOf(lk.theme) + 1) % themes.length] }); }
      }];
      if (saver && saver.available) {
        rows.push({
          kind: 'switch', on: saverOn, label: t('home.set.saver', 'AUROR screen saver'), help: t('home.set.saverHelp', 'The clock on black, moving slowly'),
          value: settings.busy === 'saver' ? t('home.set.switching', 'Switching…') : onText(saverOn),
          act: function () { setSaver(!saverOn, lk.saverBright); }
        });
      }
      rows.push({
        kind: 'cycle', label: t('home.set.saverLevel', 'Screen saver brightness'),
        value: lk.saverBright ? t('home.set.bright', 'Full') : t('home.set.dim', 'Dimmed'),
        act: function () { setLook({ saverBright: !lk.saverBright }, function () { if (saverOn) setSaver(true, !lk.saverBright); }); }
      });
      rows.push({
        kind: 'switch', on: lk.mascots, label: t('home.set.mascots', 'Mimus and Quetza'),
        help: t('home.set.mascotsHelp', 'Now and then they cross Home and the screen saver'),
        // Two of them: Italian and others make the word plural.
        value: lk.mascots ? t('home.set.onBoth', 'On') : t('home.set.offBoth', 'Off'), act: function () { setLook({ mascots: !lk.mascots }); }
      });
      return rows;
    }
    if (id === 'shelf') {
      return [
        ['jellyfin', 'Jellyfin', t('home.set.shelfJfHelp', 'Continue watching, or else Recently added')],
        ['glasshouse', 'Glasshouse', t('home.set.shelfGhHelp', 'Temperature, CPU, memory and Wi-Fi')],
        ['hdmi', t('home.set.shelfHdmi', 'HDMI inputs'), t('home.set.shelfHdmiHelp', 'The name of the device plugged in')]
      ].map(function (r) {
        var on = shelfOn(r[0]);
        return { kind: 'switch', on: on, label: r[1], help: r[2], value: onText(on),
          act: function () { var part = {}; part[r[0]] = !on; setLook({ shelf: part }); } };
      });
    }
    if (id === 'tiles') {
      return data.order.app.map(function (appId) {
        var a = byId('app', appId);
        if (!a) return null;
        if (a.lg) return { kind: 'switch', on: true, locked: true, label: a.title, help: t('home.set.lgHelp', 'The way back to LG’s Home'), value: t('home.alwaysShown', 'Always shown') };
        var shownNow = !hidden('app', appId);
        return { kind: 'switch', on: shownNow, label: a.title, value: shownNow ? t('home.shown', 'Shown') : t('home.hidden', 'Hidden'),
          act: function () { setAppHidden(appId, shownNow); } };
      }).filter(function (r) { return !!r; });
    }
    if (id === 'more') {
      return [{ kind: 'link', label: t('home.set.moreOpen', 'Open the Glasshouse app'), value: '', act: openGlasshouse }];
    }
    var jf = data.jellyfin || { configured: false };
    var list = [
      { kind: 'info', label: t('home.set.jfServer', 'Server'), value: jf.configured ? jf.server : t('home.set.jfNone', 'Not linked') },
      { kind: 'info', label: t('home.set.jfUser', 'User'), value: jf.configured ? jf.user : '—' }
    ];
    if (jf.configured) {
      list.push({ kind: 'action', label: t('home.set.jfForget', 'Unlink'), help: t('home.set.jfForgetHelp', 'The key is removed from the TV'), value: '', act: forgetJellyfin });
    }
    return list;
  }

  function qrBox() {
    var jf = (data && data.jellyfin) || {};
    return '<div class="qrbox"><div class="qr">' + (settings.pairUrl ? '<svg shape-rendering="crispEdges"></svg>' : '<span>' + esc(settings.pairError || '…') + '</span>') + '</div>' +
      '<div><div class="qt">' + esc(jf.configured ? t('home.set.jfRelink', 'Link another server from the phone') : t('home.set.jfLink', 'Link Jellyfin from the phone')) + '</div>' +
      '<div class="qd">' + esc(t('home.set.jfQrDesc', 'Scan the code: the server address and the API key are entered on the phone, not with the remote. The key stays on the TV only.')) + '</div></div></div>';
  }

  function renderSettings() {
    if (!settings.open || !data || !layout) return;
    var cat = SET_CATS[settings.cat];
    $('setTitle').textContent = cat.label;
    $('setDesc').textContent = cat.desc;
    $('setNav').innerHTML = SET_CATS.map(function (c, i) {
      return '<span class="setcat' + (i === settings.cat ? ' current' : '') + (settings.side && i === settings.cat ? ' focus' : '') +
        '" data-i="' + i + '">' + esc(c.label) + '</span>';
    }).join('');
    var rows = settings.rows = setRows(cat.id);
    var ri = settings.row[cat.id] = Math.max(0, Math.min(settings.row[cat.id] || 0, rows.length - 1));
    var html = rows.map(function (r, i) {
      var on = !settings.side && i === ri;
      return '<div class="setrow' + (on ? ' focus' : '') + (r.locked ? ' locked' : '') + '" data-i="' + i + '">' +
        '<span class="sl"><span class="lb">' + esc(r.label) + '</span>' + (on && r.help ? '<span class="hp">' + esc(r.help) + '</span>' : '') + '</span>' +
        '<span class="sv">' + esc(r.value) +
        (r.kind === 'switch' ? '<i class="sw' + (r.on ? ' on' : '') + '"><b></b></i>' : r.kind === 'cycle' || r.kind === 'link' ? '<i class="cy">›</i>' : '') +
        '</span></div>';
    }).join('');
    if (cat.id === 'jellyfin') html += qrBox();
    $('setRows').innerHTML = html;
    var svg = $('setRows').querySelector('.qr svg');
    if (svg) qrDraw(svg, settings.pairUrl);
  }

  function openSettings() {
    settings.open = true;
    settings.side = true;
    settings.cat = 0;
    stageClass();
    renderNow();
    renderSettings();
  }

  function closeSettings() {
    settings.open = false;
    clearInterval(settings.poll);
    settings.poll = null;
    stageClass();
    applyFocus();
  }

  function selectCat(i) {
    i = Math.max(0, Math.min(SET_CATS.length - 1, i));
    if (i === settings.cat) return;
    settings.cat = i;
    clearInterval(settings.poll);
    settings.poll = null;
    if (SET_CATS[i].id !== 'jellyfin') return;
    // A code lasts ten minutes on the server.
    if (!settings.pairUrl || Date.now() - settings.pairAt > 9 * 60000) requestPair();
    settings.poll = setInterval(pollJellyfin, 3000);
  }

  function requestPair() {
    settings.pairUrl = null;
    settings.pairError = '';
    postJson('/api/home/jellyfin/pair', {}, function (r) {
      if (r && r.ok && r.url) { settings.pairUrl = r.url; settings.pairAt = Date.now(); }
      else settings.pairError = (r && r.error) || t('home.set.jfNoCode', 'No code: the TV did not answer');
      renderSettings();
    });
  }

  // Linked from the phone: the rows and the shelf follow.
  function pollJellyfin() {
    getJson('/api/home/jellyfin/status', function (r) {
      if (!r || !r.ok || !data) return;
      var was = data.jellyfin || {};
      if (r.configured === !!was.configured && r.server === was.server && r.user === was.user) return;
      data.jellyfin = r;
      shelfData.jellyfin = null;
      shelfData.jellyfinAt = 0;
      if (r.configured) {
        toast(t('home.set.jfLinked', 'Jellyfin linked'), r.user);
        requestPair();
      }
      renderSettings();
    });
  }

  function openGlasshouse() {
    postJson('/api/home/open', { kind: 'app', id: DASHBOARD_APP }, function (r) {
      if (!r || !r.ok) toast(t('home.openFailed', 'That did not open'), r && r.error);
    });
  }

  function forgetJellyfin() {
    postJson('/api/home/jellyfin/forget', {}, function (r) {
      if (!r || !r.ok) return toast(t('home.set.saveFailed', 'That setting could not be saved'), r && r.error);
      data.jellyfin = { configured: false };
      shelfData.jellyfin = null;
      shelfData.jellyfinAt = 0;
      renderSettings();
    });
  }

  function setLook(patch, then) {
    postJson('/api/home/look', patch, function (r) {
      if (!r || !r.ok || !r.layout) return toast(t('home.set.saveFailed', 'That setting could not be saved'), r && r.error);
      layout.look = r.layout.look;
      if (r.layoutVersion) layoutVersion = r.layoutVersion;
      shelfShown = null;
      applyTheme();
      renderShelf();
      renderSettings();
      if (then) then();
    });
  }

  function setAppHidden(appId, hide) {
    var list = layout.hidden.app.slice(), i = list.indexOf(appId);
    if (hide && i === -1) list.push(appId);
    if (!hide && i !== -1) list.splice(i, 1);
    postJson('/api/home/layout', { hidden: { app: list } }, function (r) {
      if (!r || !r.ok || !r.layout) return toast(t('home.arrange.saveFailed', 'Layout could not be saved'));
      layout = r.layout;
      if (r.layoutVersion) layoutVersion = r.layoutVersion;
      render();
      renderSettings();
    });
  }

  // Changing screen saver remounts LG's app, which can take most of a minute.
  function setSaver(on, bright) {
    if (settings.busy) return;
    settings.busy = 'saver';
    renderSettings();
    request('POST', '/api/home/screensaver', { on: on, bright: !!bright }, function (r) {
      settings.busy = '';
      if (r && r.current && data.saver) { data.saver.mode = r.current; data.saver.level = r.level; }
      if (!r || !r.ok) toast(t('home.set.saverFailed', 'The screen saver did not change'), r && r.error);
      renderSettings();
    }, 90000);
  }

  function settingsKey(k) {
    var cat = SET_CATS[settings.cat];
    if (k === KEY.back) return closeSettings();
    if (settings.side) {
      if (k === KEY.up || k === KEY.down) selectCat(settings.cat + (k === KEY.up ? -1 : 1));
      else if ((k === KEY.right || k === KEY.ok) && settings.rows.length) settings.side = false;
      return renderSettings();
    }
    var ri = settings.row[cat.id] || 0;
    if (k === KEY.left) settings.side = true;
    else if (k === KEY.up) settings.row[cat.id] = Math.max(0, ri - 1);
    else if (k === KEY.down) settings.row[cat.id] = Math.min(settings.rows.length - 1, ri + 1);
    else if (k === KEY.ok && settings.rows[ri] && settings.rows[ri].act) return settings.rows[ri].act();
    renderSettings();
  }

  function settingsAt(target) {
    while (target && target !== document.body) {
      if (target.id === 'setBack') return { back: true };
      var cls = typeof target.className === 'string' ? target.className : '';
      if (/\bsetcat\b/.test(cls)) return { cat: +target.getAttribute('data-i') };
      if (/\bsetrow\b/.test(cls)) return { row: +target.getAttribute('data-i') };
      target = target.parentNode;
    }
    return null;
  }

  function settingsPointer(target, click) {
    var hit = settingsAt(target);
    if (!hit) return;
    if (hit.back) { if (click) closeSettings(); return; }
    var cat = SET_CATS[settings.cat];
    if (hit.cat !== undefined) {
      if (hit.cat === settings.cat && settings.side) return;
      settings.side = true;
      selectCat(hit.cat);
    } else {
      var changed = settings.side || settings.row[cat.id] !== hit.row;
      settings.side = false;
      settings.row[cat.id] = hit.row;
      if (click && settings.rows[hit.row] && settings.rows[hit.row].act) return settings.rows[hit.row].act();
      if (!changed) return;
    }
    renderSettings();
  }

  // ---------------------------------------------------------------- mascots

  /*
   * Every few minutes Mimus runs along the bottom or Quetza glides across the
   * top, on Home itself only and unless switched off; ?mascots=demo sends
   * them every few seconds.
   */
  var mascotTimer = null;
  var MASCOTS = { mimus: { ms: 9000, file: 'mimus-run' }, quetza: { ms: 14000, file: 'quetza' } };
  function planMascot() {
    clearTimeout(mascotTimer);
    var demo = /[?&]mascots=demo/.test(location.search);
    mascotTimer = setTimeout(showMascot, demo ? 2000 + Math.random() * 4000 : 180000 + Math.random() * 420000);
  }
  function showMascot() {
    var el = $('mascot');
    if (!layout || !look().mascots || document.hidden || state.arranging || recents.open || settings.open || faultShown) return planMascot();
    var who = /[?&]mascot=(mimus|quetza)/.exec(location.search);
    who = who ? who[1] : Math.random() < 0.5 ? 'mimus' : 'quetza';
    el.innerHTML = '<img src="/assets/screensavers/' + MASCOTS[who].file + '-' + themeName + '.gif" alt="">';
    el.className = '';
    void el.offsetWidth;
    el.className = who;
    mascotTimer = setTimeout(function () { el.className = ''; el.innerHTML = ''; planMascot(); }, MASCOTS[who].ms + 200);
  }

  var faultShown = false;
  function showFault(on) {
    if (on === faultShown) return;
    faultShown = on;
    $('fault').className = on ? 'show' : '';
    stageClass();
  }

  /*
   * The plate. An input's signal is read off its receiver, so it is there
   * while Home is; an app's is the last video it played, noted by the server
   * while it played. A channel has none, and shows the mode it gets in SDR;
   * an app that has played nothing shows no plate.
   */
  var picture = null;
  var pictureRevision = 0;
  var pictureSource = null;
  var HDR_NAMES = { hdr10: 'HDR10', hlg: 'HLG', dolby_vision: t('home.plate.dolby', 'Dolby Vision') };

  function refreshPicture() {
    var revision = ++pictureRevision;
    var kind = lastOn.kind;
    if (!layout || layout.picture !== true) kind = null;
    if (kind !== 'input' && kind !== 'channel' && kind !== 'app') {
      pictureSource = null;
      picture = null;
      return renderPicture();
    }
    var which = kind === 'input' ? '&port=' + lastOn.port : kind === 'app' ? '&app=' + encodeURIComponent(lastOn.appId || '') : '';
    var source = kind + which;
    if (source !== pictureSource) {
      pictureSource = source;
      picture = null;
      renderPicture();
    }
    getJson('/api/home/picture?kind=' + kind + which, function (r) {
      if (revision !== pictureRevision) return;
      picture = r && r.ok ? r : null;
      renderPicture();
    });
  }

  function hz(v) { return String(Math.round(v * 100) / 100); }

  function renderPicture() {
    var p = picture;
    var s = p && p.signal;
    if (!p || !(s || p.mode || lastOn.kind === 'input')) { $('plate').className = 'none'; return; }
    var sig = [];
    if (s) {
      // An app's video, noted while it played: it has stopped since.
      if (s.played) sig.push(t('home.plate.played', 'Last video'));
      sig.push(s.hz ? t('home.plate.size', '{width} \u00d7 {height} at {hz} Hz', { width: s.width, height: s.height, hz: hz(s.hz) })
        : t('home.plate.sizeOnly', '{width} \u00d7 {height}', { width: s.width, height: s.height }));
      if (s.chroma) sig.push(s.bits ? t('home.plate.depth', '{chroma}, {bits}-bit', { chroma: s.chroma.replace(/^YCbCr /, ''), bits: s.bits }) : s.chroma);
      if (HDR_NAMES[s.hdr]) sig.push(HDR_NAMES[s.hdr]);
      if (s.vrr) sig.push(t('home.plate.vrr', 'VRR'));
      if (s.allm) sig.push(t('home.plate.allm', 'Low latency'));
    } else if (lastOn.kind === 'input') {
      sig.push(t('home.plate.noSignal', 'No picture coming in'));
    }
    $('plSig').innerHTML = sig.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
    $('plMode').textContent = p.mode ? p.mode.display : '';
    $('plStrip').innerHTML = p.mode && typeof p.light === 'number'
      ? '<div><b>' + esc(p.oled ? t('home.plate.oledLight', 'OLED light') : t('home.plate.backlight', 'Backlight')) +
        '</b>' + esc(p.light) + '</div>'
      : '';
    $('plate').className = '';
  }

  // ---------------------------------------------------------------- actions

  var toastTimer = null;
  function toast(main, detail) {
    var el = $('toast');
    el.innerHTML = esc(main) + (detail ? '<small>' + esc(detail) + '</small>' : '');
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 3600);
  }

  function activate() {
    var kind = rowKey(), it = items(kind)[colOf(kind)];
    if (!it) return;
    postJson('/api/home/open', { kind: kind, id: it.id }, function (r) {
      if (!r || !r.ok) toast(t('home.openFailed', 'That did not open'), r && r.error);
    });
  }

  function move(dr, dc) {
    // Up from the first row reaches the buttons over the Top Shelf; down comes back.
    if (state.top >= 0) {
      if (dr > 0) state.top = -1;
      else if (dc) state.top = Math.max(0, Math.min(TOP.length - 1, state.top + dc));
      return applyFocus();
    }
    var onSort = colOf(rowKey()) === -1;
    if (dr) {
      var to = nextShown(state.row + dr, dr);
      if (to >= 0 && to < layout.rows.length && shown(to)) state.row = to;
      else if (dr < 0 && !state.arranging) { state.top = 0; return applyFocus(); }
    }
    // Up and down from a row's Order go to the next row's.
    if (dr && onSort) state.col[rowKey()] = -1;
    if (dc) {
      var kind = rowKey();
      state.col[kind] = Math.max(state.arranging ? -1 : 0, Math.min(items(kind).length - 1, colOf(kind) + dc));
    }
    applyFocus();
  }

  function stageClass() {
    // inputs: the Inputs row shows, so the shelf makes room for it.
    var inputs = !!(data && layout && !state.arranging && items('dev').length);
    $('stage').className = (state.arranging ? 'arranging' : '') + (recents.open ? ' recents' : '') + (themeName === 'light' ? ' light' : '') +
      (settings.open ? ' settings' : '') + (faultShown ? ' fault' : '') + (inputs ? ' inputs' : '');
  }

  // ---------------------------------------------------------------- recent apps

  /*
   * Back's panel: the TV's recent apps, newest first, as LG's Home shows them
   * (lib/home-recent-apps). Up from the cards is Close all; down from a card
   * is its Close. Where the TV has no list, Back goes to the first tile.
   */
  var recents = { open: false, loading: false, revision: 0, apps: [], col: 0, onX: false, onAll: false, busy: false, stamp: 0 };

  function openRecents() {
    if (recents.busy) return;
    recents.busy = true;
    recents.loading = true;
    var revision = ++recents.revision;
    getJson('/api/home/recents', function (r) {
      recents.busy = false;
      if (revision !== recents.revision) return;
      recents.loading = false;
      if (!r || !r.ok) {
        state.row = nextShown(0, 1); state.col[rowKey()] = 0;
        return applyFocus();
      }
      recents.open = true;
      recents.col = 0; recents.onX = false; recents.onAll = false;
      showRecents(r.apps);
      stageClass();
    });
  }

  function closeRecents() {
    recents.revision++;
    recents.loading = false;
    recents.open = false;
    stageClass();
  }

  function showRecents(apps) {
    recents.apps = apps || [];
    recents.stamp = Date.now();
    recents.col = Math.max(0, Math.min(recents.col, recents.apps.length - 1));
    if (!recents.apps.length) { recents.onX = false; recents.onAll = false; }
    var html = '';
    recents.apps.forEach(function (a, i) {
      var mono = '<span class="mono">' + esc(String(a.title).charAt(0)) + '</span>';
      var shot = a.image ? '<img src="/api/home/recents/image?id=' + encodeURIComponent(a.id) + '&v=' + recents.stamp + '" alt="">' : mono;
      html += '<div class="tile rc" data-c="' + i + '"><div class="shot">' + shot + '</div>' +
        '<div class="nm">' + esc(a.title) + '</div><span class="x">' + esc(t('home.recents.close', 'Close')) + '</span></div>';
    });
    $('recentsTrack').innerHTML = html || '<div class="empty"><b>' + esc(t('home.recents.none', 'Nothing is open')) + '</b>' +
      esc(t('home.recents.noneDesc', 'Apps stay here while they are open.')) + '</div>';
    // A snapshot can be gone by the time it is asked for: the card keeps the app's initial.
    var imgs = $('recentsTrack').querySelectorAll('img');
    for (var j = 0; j < imgs.length; j++) {
      imgs[j].onerror = function () {
        var span = document.createElement('span');
        span.className = 'mono';
        span.textContent = (this.parentNode.parentNode.querySelector('.nm').textContent || '').charAt(0);
        this.parentNode.replaceChild(span, this);
      };
    }
    focusRecents(true);
  }

  function focusRecents(instant) {
    var cards = $('recentsTrack').querySelectorAll('.rc');
    for (var i = 0; i < cards.length; i++) {
      var on = i === recents.col && !recents.onAll;
      cards[i].className = 'tile rc' + (on ? ' focus' : '') + (on && recents.onX ? ' on-x' : '');
    }
    $('btnCloseAll').className = 'btn' + (recents.apps.length ? '' : ' none') + (recents.onAll ? ' focus' : '');
    scrollTrack($('recents'), cards[recents.col], instant);
  }

  function recentAction(action, app) {
    if (recents.busy) return;
    recents.busy = true;
    var revision = recents.revision;
    postJson('/api/home/recents', { action: action, id: app && app.id }, function (r) {
      recents.busy = false;
      if (revision !== recents.revision) return;
      if (!r || !r.ok) {
        return toast(action === 'open' ? t('home.openFailed', 'That did not open') : t('home.recents.closeFailed', 'That did not close'), r && r.error);
      }
      if (action === 'open') return closeRecents();
      if (action === 'closeAll') {
        closeRecents();
        return toast(t('home.recents.allClosed', 'Recent apps closed'));
      }
      showRecents(r.apps);
    });
  }

  function recentsKey(k) {
    var app = recents.apps[recents.col];
    if (k === KEY.back) return closeRecents();
    if (recents.onAll) {
      if (k === KEY.ok) return recentAction('closeAll');
      if (k === KEY.down) recents.onAll = false;
      return focusRecents();
    }
    if (!app) return;
    if (k === KEY.left || k === KEY.right) {
      recents.col = Math.max(0, Math.min(recents.apps.length - 1, recents.col + (k === KEY.left ? -1 : 1)));
      recents.onX = false;
    } else if (k === KEY.up) {
      if (recents.onX) recents.onX = false; else recents.onAll = true;
    } else if (k === KEY.down) {
      recents.onX = true;
    } else if (k === KEY.ok) {
      return recentAction(recents.onX ? 'close' : 'open', app);
    } else if (k === KEY.red) {
      return recentAction('close', app);
    }
    focusRecents();
  }

  function recentsClick(target) {
    if (target.id === 'btnCloseAll') return recentAction('closeAll');
    var card = tileAt(target);
    if (!card || !/\brc\b/.test(card.className)) return closeRecents();
    recents.col = +card.getAttribute('data-c');
    recentAction(target.className === 'x' ? 'close' : 'open', recents.apps[recents.col]);
  }

  // ---------------------------------------------------------------- arranging

  /*
   * Only the rows whose tiles were moved send their order: a row left alone
   * keeps following its default, the Apps row most-used first. Saved while
   * arranging (stay), the rows are read again, so a row set to Last opened
   * shows that order.
   */
  var movedRows = {}, channelsChanged = false;
  function saveLayout(extra, stay, saved) {
    layoutRevision++;
    layoutBusy = true;
    var order = {};
    for (var kind in movedRows) order[kind] = data.order[kind];
    var body = { rows: layout.rows, order: order, sort: layout.sort, hidden: layout.hidden };
    if (channelsChanged) body.channels = layout.channels;
    for (var k in extra) body[k] = extra[k];
    postJson('/api/home/layout', body, function (r) {
      layoutRevision++;
      if (!r || !r.ok || !r.layout) {
        layoutBusy = false;
        return toast(t('home.arrange.saveFailed', 'Layout could not be saved'));
      }
      movedRows = {};
      channelsChanged = false;
      layout = r.layout;
      if (!stay) {
        layoutBusy = false;
        toast(t('home.arrange.saved', 'Layout saved'), t('home.arrange.savedDesc', 'The dashboard\'s Home tab shows it too'));
        return load();
      }
      // Keep edits blocked until the new order has arrived as well as the save.
      load(function (loaded) { layoutBusy = false; render(); if (loaded && saved) saved(); }, true);
    });
  }

  function setArranging(on) {
    if (layoutBusy) return;
    layoutRevision++;
    // The focus stays on the same item as hidden tiles appear or go.
    var kind = rowKey(), cur = items(kind)[colOf(kind)];
    state.arranging = on;
    state.held = false;
    state.bar = -1;
    if (cur) {
      var list = items(kind);
      for (var i = 0; i < list.length; i++) if (list[i].id === cur.id) state.col[kind] = i;
    }
    if (!on) {
      saveLayout({});
    }
    render();
  }

  /*
   * Picking a tile up in a Last opened row puts the row in the order it
   * shows, to be moved from there.
   */
  function pickUp() {
    var kind = rowKey();
    if (colOf(kind) === -1) return toggleSort(kind);
    if (!state.held && items(kind).length && byRecent(kind)) {
      layout.sort[kind] = 'custom';
      movedRows[kind] = true;
      toast(t('home.arrange.nowCustom', '{row} are now in your order', { row: ROW_TITLES[kind] }),
            t('home.arrange.nowCustomDesc', 'The row\'s Order, left of its first tile, puts them back in last opened order'));
      render();
    }
    state.held = !state.held;
    applyFocus();
  }

  // A row's Order: between its own order and last opened.
  function toggleSort(kind) {
    if (layoutBusy) return;
    state.held = false;
    if (!layout.sort) layout.sort = {};
    var recent = !byRecent(kind);
    layout.sort[kind] = recent ? 'recent' : 'custom';
    saveLayout({}, true, function () {
      toast(recent ? t('home.arrange.sortedRecent', '{row}: last opened first', { row: ROW_TITLES[kind] })
                   : t('home.arrange.sortedCustom', '{row}: in your order', { row: ROW_TITLES[kind] }),
            recent ? t('home.arrange.sortedRecentDesc', 'Each tile moves to the front when it is opened')
                   : t('home.arrange.sortedCustomDesc', 'Pick a tile up with OK to move it'));
    });
  }

  function shiftTile(dc) {
    var kind = rowKey(), list = items(kind), i = colOf(kind), j = i + dc;
    if (j < 0 || j >= list.length) return;
    var order = data.order[kind], a = order.indexOf(list[i].id), b = order.indexOf(list[j].id);
    var tmp = order[a]; order[a] = order[b]; order[b] = tmp;
    movedRows[kind] = true;
    state.col[kind] = j;
    render();
  }

  function shiftRow(dr) {
    var i = state.row, j = i + dr;
    if (j < 0 || j >= layout.rows.length) return;
    var tmp = layout.rows[i]; layout.rows[i] = layout.rows[j]; layout.rows[j] = tmp;
    state.row = j;
    render();
  }

  function toggleHidden() {
    var last = state.last;
    // The LG Home tile is the way back to LG's Home, so it always shows.
    if (!last || (last.kind === 'app' && last.id === LG_HOME_TILE)) return;
    var kind = last.kind, it = byId(kind, last.id);
    if (!it) return;
    if (kind === 'ch') {
      layout.channels = layout.channels.filter(function (id) { return id !== it.id; });
      data.order.ch = data.order.ch.filter(function (id) { return id !== it.id; });
      channelsChanged = true;
      return render();
    }
    var h = layout.hidden[kind], i = h.indexOf(it.id);
    if (i >= 0) h.splice(i, 1); else h.push(it.id);
    render();
  }

  function resetLayout() {
    if (layoutBusy) return;
    layoutRevision++;
    layoutBusy = true;
    postJson('/api/home/layout', { reset: true }, function (r) {
      layoutBusy = false;
      layoutRevision++;
      if (!r || !r.ok || !r.layout) return toast(t('home.arrange.resetFailed', 'Layout could not be reset'));
      movedRows = {};
      channelsChanged = false;
      layout = r.layout;
      state.row = 0; state.col = {}; state.held = false;
      load(function () { render(); toast(t('home.arrange.resetDone', 'Layout reset'), t('home.arrange.resetDesc', 'Apps, Inputs, then Channels, in their first order')); }, true);
    });
  }

  function pressBar(b) {
    if (b === 0) { state.bar = -1; toggleHidden(); }
    else if (b === 1) resetLayout();
    else setArranging(false);
  }

  function arrangeKey(k) {
    if (state.bar >= 0) {
      if (k === KEY.left) state.bar = Math.max(0, state.bar - 1);
      else if (k === KEY.right) state.bar = Math.min(BAR.length - 1, state.bar + 1);
      else if (k === KEY.up) state.bar = -1;
      else if (k === KEY.ok) return pressBar(state.bar);
      return applyFocus();
    }
    if (k === KEY.left) return state.held ? shiftTile(-1) : move(0, -1);
    if (k === KEY.right) return state.held ? shiftTile(1) : move(0, 1);
    if (k === KEY.up) return state.held ? shiftRow(-1) : move(-1, 0);
    if (k === KEY.down) {
      if (state.held) return shiftRow(1);
      if (state.row === layout.rows.length - 1) { state.bar = 0; return applyFocus(); }
      return move(1, 0);
    }
    if (k === KEY.ok) return pickUp();
    if (k === KEY.red) return toggleHidden();
    if (k === KEY.yellow) return resetLayout();
  }

  // ---------------------------------------------------------------- input

  function onKeyDown(e) {
    if (!data || !layout) return;
    if (layoutBusy) { e.preventDefault(); return; }
    var k = e.keyCode;
    if (k === KEY.ok) {
      // Acted on at release, unless held: a long press arranges.
      e.preventDefault();
      if (okDownAt) return;
      okDownAt = Date.now();
      okLong = false;
      okInRecents = recents.open || settings.open;
      if (okInRecents) return;
      okTimer = setTimeout(function () {
        okLong = true;
        if (state.held || state.top >= 0) return;
        setArranging(!state.arranging);
      }, LONG_PRESS_MS);
      return;
    }
    if (k === KEY.back) {
      e.preventDefault();
      if (backDown) return;
      backDown = true;
      if (settings.open) return closeSettings();
      if (recents.open || recents.loading) return closeRecents();
      if (state.arranging && state.held) { state.held = false; return toggleHidden(); }
      if (state.arranging) return setArranging(false);
      return openRecents();
    }
    if (recents.open) { e.preventDefault(); return recentsKey(k); }
    if (settings.open) { e.preventDefault(); return settingsKey(k); }
    if (state.arranging) { arrangeKey(k); e.preventDefault(); return; }
    if (k === KEY.left) move(0, -1);
    else if (k === KEY.right) move(0, 1);
    else if (k === KEY.up) move(-1, 0);
    else if (k === KEY.down) move(1, 0);
    else return;
    e.preventDefault();
  }

  function onKeyUp(e) {
    if (e.keyCode === KEY.back) { backDown = false; return; }
    if (e.keyCode !== KEY.ok || !okDownAt) return;
    e.preventDefault();
    clearTimeout(okTimer);
    okDownAt = 0;
    if (okLong || layoutBusy) return;
    if (okInRecents) {
      if (recents.open) recentsKey(KEY.ok);
      else if (settings.open) settingsKey(KEY.ok);
      return;
    }
    if (recents.open || recents.loading) return;
    if (state.arranging) arrangeKey(KEY.ok);
    else if (state.top >= 0) pressTop(state.top);
    else activate();
  }

  // The Magic Remote's pointer: hovering focuses a tile, clicking opens it.
  function tileAt(target) {
    while (target && target !== document.body) {
      if (target.className && /\btile\b/.test(target.className)) return target;
      target = target.parentNode;
    }
    return null;
  }
  function onPointer(e) {
    if (layoutBusy) return;
    if (settings.open) return settingsPointer(e.target, false);
    var tile = tileAt(e.target);
    if (recents.open) {
      if (tile && /\brc\b/.test(tile.className) && (+tile.getAttribute('data-c') !== recents.col || recents.onAll)) {
        recents.col = +tile.getAttribute('data-c'); recents.onAll = false; recents.onX = false;
        focusRecents();
      }
      return;
    }
    var top = topAt(e.target);
    if (top >= 0 && !state.arranging) {
      if (state.top !== top) { state.top = top; applyFocus(); }
      return;
    }
    if (!tile || state.held) return;
    var rowEl = tile.parentNode;
    while (rowEl && !/\brow\b/.test(rowEl.className)) rowEl = rowEl.parentNode;
    var r = +rowEl.getAttribute('data-row'), c = +tile.getAttribute('data-c'), kind = layout.rows[r];
    if (state.row !== r || colOf(kind) !== c || state.bar >= 0 || state.top >= 0) {
      state.row = r; state.col[kind] = c; state.bar = -1; state.top = -1;
      applyFocus();
    }
  }
  function onClick(e) {
    if (!data || !layout || layoutBusy) return;
    if (recents.open) return recentsClick(e.target);
    if (settings.open) return settingsPointer(e.target, true);
    var btn = e.target && e.target.id;
    if (BAR.indexOf(btn) !== -1) return pressBar(BAR.indexOf(btn));
    if (topAt(e.target) >= 0) return state.arranging ? undefined : pressTop(topAt(e.target));
    if (state.arranging && /\bsort\b/.test(e.target.className || '')) {
      var sortRow = e.target.parentNode.parentNode;
      state.row = +sortRow.getAttribute('data-row');
      state.col[rowKey()] = -1;
      return toggleSort(rowKey());
    }
    if (!tileAt(e.target)) return;
    if (state.arranging) pickUp();
    else activate();
  }

  // ---------------------------------------------------------------- wallpaper

  // Strength is how far the picture shows through the black: lower at night.
  var WALL_SLOTS = [
    { key: 'night', from: 0, strength: 0.55 },
    { key: 'morning', from: 6, strength: 0.7 },
    { key: 'afternoon', from: 11, strength: 0.62 },
    { key: 'evening', from: 17, strength: 0.72 },
    { key: 'night', from: 21, strength: 0.65 }
  ];
  var wallShown = null, wallFront = 0;
  /*
   * ?wall=morning or ?hour=19 shows another slot, to check each one, as does
   * launching the app with { wall } or { hour }: a running app gets them at
   * its relaunch, without loading the page again.
   */
  var preview = { wall: (/[?&]wall=([a-z]+)/.exec(location.search) || [])[1], hour: (/[?&]hour=(\d+)/.exec(location.search) || [])[1] };
  function readLaunchParams() {
    var p = {};
    try { p = JSON.parse(window.PalmSystem.launchParams || '{}') || {}; } catch (e) {}
    preview = { wall: /^[a-z]+$/.test(String(p.wall || '')) ? p.wall : undefined,
                hour: /^\d{1,2}$/.test(String(p.hour || '')) ? p.hour : undefined };
  }
  function wallSlot() {
    if (preview.wall) for (var i = 1; i < WALL_SLOTS.length; i++) if (WALL_SLOTS[i].key === preview.wall) return WALL_SLOTS[i];
    var h = preview.hour !== undefined ? +preview.hour % 24 : new Date().getHours(), slot = WALL_SLOTS[0];
    for (var j = 0; j < WALL_SLOTS.length; j++) if (WALL_SLOTS[j].from <= h) slot = WALL_SLOTS[j];
    return slot;
  }
  function updateWall() {
    var slot = wallSlot();
    if (!wallAvailable || (wallSlots && !wallSlots[slot.key])) {
      var blank = $('wall').querySelectorAll('.layer');
      for (var b = 0; b < blank.length; b++) { blank[b].style.opacity = 0; blank[b].style.backgroundImage = ''; }
      wallShown = null;
      return;
    }
    var revision = wallRevision, id = slot.key + '@' + slot.strength + '@' + revision;
    if (id === wallShown) return;
    var layers = $('wall').querySelectorAll('.layer');
    var next = layers[1 - wallFront], prev = layers[wallFront];
    var src = '/api/home/wallpaper?slot=' + slot.key + '&v=' + encodeURIComponent(revision);
    var img = new Image();
    img.onload = function () {
      if (!wallAvailable || wallRevision !== revision || wallSlot().key !== slot.key) return;
      wallShown = id;
      next.style.backgroundImage = 'url(' + src + ')';
      next.style.opacity = slot.strength;
      prev.style.opacity = 0;
      wallFront = 1 - wallFront;
    };
    img.src = src;
  }

  // ---------------------------------------------------------------- colours

  /*
   * The dashboards' choice of text and accent colour, swapped into this
   * page's stylesheet: custom properties would need Chromium 49, and the TV
   * pages are kept to what webOS 3's Chromium 38 runs (check-es5.py). The
   * quieter text and the held tile's tint are mixed toward black from the
   * chosen colours, in the proportions the page's own have to #ece7df and
   * #e9ad55. The view's own look frames whatever has focus in its text
   * colour, always as outline-color:#ece7df; chosen colours frame it in the
   * accent.
   */
  var LOOK = $('look').textContent, lookShown = '';
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16), out = '#';
    [n >> 16, (n >> 8) & 255, n & 255].forEach(function (v) {
      var x = Math.round(v * f);
      out += (x < 16 ? '0' : '') + x.toString(16);
    });
    return out;
  }
  function applyColours(c) {
    var key = c ? c.text + c.accent : '';
    if (key === lookShown) return;
    lookShown = key;
    if (!c) { $('look').textContent = LOOK; return; }
    var swap = { '#ece7df': c.text, '#a39d93': shade(c.text, 0.69), '#6b665e': shade(c.text, 0.45),
                 '#e9ad55': c.accent, '#231d12': shade(c.accent, 0.15) };
    // Replace once: a chosen accent may itself be one of the original colours.
    $('look').textContent = LOOK.replace(/outline-color:#ece7df\b|#(?:ece7df|a39d93|6b665e|e9ad55|231d12)\b/g,
      function (m) { return m === 'outline-color:#ece7df' ? 'outline-color:' + c.accent : swap[m]; });
  }

  // ---------------------------------------------------------------- data

  function load(cb, whileArranging) {
    if ((layoutBusy || state.arranging) && !whileArranging) return;
    var revision = layoutRevision;
    getJson('/api/home/catalogue', function (r) {
      if (!r || !r.ok) {
        if (!data) {
          showFault(true);
          // A live HTTP server is not enough: Home needs its tiles and escape tile.
          if (!document.hidden && !initialEscape) {
            initialEscape = true;
            postJson('/api/home/open', { kind: 'lg', recovery: true });
          }
          clearTimeout(loadRetry);
          loadRetry = setTimeout(function () { if (!document.hidden) load(); }, 2000);
        }
        return cb && cb(false);
      }
      // A reply sent before arranging or saving must not replace local edits.
      if (revision !== layoutRevision || ((layoutBusy || state.arranging) && !whileArranging)) return;
      var firstLoad = !data;
      data = r;
      layout = r.layout;
      applyColours(layout.colours);
      if (r.layoutVersion) layoutVersion = r.layoutVersion;
      refreshPicture();
      clearTimeout(loadRetry);
      wallAvailable = !!(r.wallpapers && r.wallpapers.available);
      wallSlots = r.wallpapers && r.wallpapers.slots;
      wallRevision = r.wallpapers && r.wallpapers.revision || '';
      updateWall();
      if (!state.arranging) render();
      if (firstLoad) { beat(); planMascot(); }
      renderSettings();
      if (!layout.hintSeen) {
        toast(t('home.hint.title', 'Hold OK to arrange'), t('home.hint.desc', 'Move or hide tiles and rows. LG\'s Home is the last tile in Apps.'));
        postJson('/api/home/layout', { hintSeen: true });
        layout.hintSeen = true;
      }
      refreshGuide();
      if (cb) cb(true);
    });
    refreshNow();
  }

  function refreshNow() {
    getJson('/api/home/now', function (r) {
      if (!r) return;
      lastOn = r;
      renderNow();
      refreshPicture();
      if (data && !state.arranging) render();
    });
  }

  function refreshGuide() {
    if (!layout || !layout.channels.length) return;
    getJson('/api/home/guide', function (r) {
      if (!r || !r.guide) return;
      guideData = r.guide;
      if (!state.arranging && data) render();
    });
  }

  /*
   * The server watches for these: the view in front without them for ten
   * seconds is taken to be broken, and LG's Home opens instead. With the
   * server gone, the page says so; the page is LG's Home's app, so only the
   * server's watchdog can put LG's back (tvwebctl).
   */
  function beat() {
    // With no usable catalogue, let the server's ten-second watchdog recover Home.
    if (!data || !layout) return;
    postJson('/api/home/beat', {}, function (r) {
      if (r && r.ok) {
        beatFails = 0;
        wallAvailable = !!(r.wallpapers && r.wallpapers.available);
        wallSlots = r.wallpapers && r.wallpapers.slots;
        wallRevision = r.wallpapers && r.wallpapers.revision || '';
        updateWall();
        showFault(false);
        // A new release of the server: the page is the old one's until reloaded.
        if (build && r.build && r.build !== build) {
          if (!state.arranging && !layoutBusy) location.reload();
          return;
        }
        build = r.build || build;
        if (r.layoutVersion && layoutVersion && r.layoutVersion !== layoutVersion && !state.arranging && !layoutBusy) load();
        return;
      }
      if (++beatFails === 3) showFault(true);
    });
  }

  function returned() {
    initialEscape = false;
    clearTimeout(okTimer);
    okDownAt = 0; backDown = false;
    closeRecents();
    readLaunchParams();
    updateWall();
    state.row = 0; state.col = {}; state.bar = -1; state.top = -1;
    if (settings.open) closeSettings();
    if (state.arranging) setArranging(false);
    beat();
    load();
  }

  window.addEventListener('resize', fit);
  document.addEventListener('keydown', onKeyDown, true);
  document.addEventListener('keyup', onKeyUp, true);
  document.addEventListener('mousemove', onPointer);
  document.addEventListener('click', onClick);
  // Home pressed with the view already open reaches it as a relaunch.
  document.addEventListener('webOSRelaunch', returned);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) returned(); });

  fit();
  renderNow();
  updateWall();
  beat();
  load();
  setInterval(beat, BEAT_MS);
  setInterval(function () { renderNow(); updateWall(); if (!document.hidden) refreshPicture(); }, 15000);
  setInterval(function () { refreshNow(); refreshGuide(); }, 60000);
  setInterval(function () { if (!state.arranging) load(); }, 5 * 60000);
})();
</script>
</body>
</html>
